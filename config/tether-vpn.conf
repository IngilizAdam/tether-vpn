# /etc/tether-vpn.conf — settings for tether-vpn (sourced as bash)

# Wi-Fi network names (SSIDs) that need the proxy. Shell globs are allowed.
# TetherFi's Wi-Fi Direct networks always start with "DIRECT-".
# Put the exact name in quotes if you know it, e.g. SSIDS=("DIRECT-TF-MyPhone")
SSIDS=("DIRECT-*")

# USB: turn on Android's USB tethering, then start TetherFuseNet with its
# broadcast type set to "USB Tethering" (expert settings). The phone shows up
# here as an ethernet card using one of these drivers. The tunnel only starts
# once the proxy answers, so plain USB tethering keeps working as usual.
USB_TETHER="yes"
USB_DRIVERS=(rndis_host cdc_ncm)

# Proxy address. "auto" means "the gateway of the Wi-Fi or USB link", which is
# the phone itself (TetherFuseNet's Wi-Fi usually shows 192.168.49.1; USB
# tethering picks a new random subnet every time). Set an IP to override it.
PROXY_HOST="auto"
PROXY_PORT="8228"

# DNS servers used while the tunnel is up. Lookups use DNS-over-TLS (TCP 853),
# so they still work if the proxy can't carry UDP.
# Format is IP#hostname, and the hostname is used to check the TLS certificate.
DNS_SERVERS=("1.1.1.1#cloudflare-dns.com" "9.9.9.9#dns.quad9.net")

# Name and address of the virtual network card. Pick a private range that
# nothing else on your machine uses.
TUN_DEV="tether0"
TUN_ADDR="198.18.0.1"
TUN_GW="198.18.0.2"
